<svg viewBox="0 0 1120 1400" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1120" height="1400" fill="#FBFAF7"/>

  <!-- Header -->
  <text x="560" y="58" text-anchor="middle" font-size="13" letter-spacing="6" fill="#B68A4E">ROUND TWO</text>
  <text x="560" y="102" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="38" letter-spacing="1" fill="#15212E">Marque Publishing — Four Survivors</text>
  <text x="560" y="130" text-anchor="middle" font-size="12" letter-spacing="4" fill="#7A8089">THE SEAL · THE HALLMARK · THE DAGGER · THE IMPRINT</text>
  <line x1="60" y1="152" x2="1060" y2="152" stroke="#D8D2C6" stroke-width="1"/>

  <!-- SECTION A -->
  <text x="60" y="190" font-size="12" letter-spacing="3" font-weight="600" fill="#B68A4E">WHERE YOU'RE LEANING — TWO TAKES EACH</text>
  <line x1="560" y1="230" x2="560" y2="600" stroke="#E6E0D4" stroke-width="1"/>

  <!-- 1A Engraved Seal (cx310 my290) -->
  <circle cx="310" cy="290" r="58" fill="none" stroke="#15212E" stroke-width="2.5"/>
  <circle cx="310" cy="290" r="52" fill="none" stroke="#B68A4E" stroke-width="1" stroke-dasharray="1.5 5.6"/>
  <circle cx="310" cy="290" r="46" fill="none" stroke="#B68A4E" stroke-width="0.8"/>
  <polygon points="310,236 315,244 310,252 305,244" fill="#B68A4E"/>
  <text x="310" y="308" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="50" font-weight="600" fill="#15212E">M</text>
  <text x="310" y="392" text-anchor="middle" font-size="13" letter-spacing="2" font-weight="600" fill="#15212E">1A · ENGRAVED SEAL</text>

  <!-- 1B Cabled Seal (cx810 my290) -->
  <circle cx="810" cy="290" r="60" fill="none" stroke="#15212E" stroke-width="1"/>
  <circle cx="810" cy="290" r="56" fill="none" stroke="#B68A4E" stroke-width="4.5" stroke-dasharray="5 3.4"/>
  <circle cx="810" cy="290" r="47" fill="none" stroke="#15212E" stroke-width="1.4"/>
  <polygon points="810,238 815,246 810,254 805,246" fill="#B68A4E"/>
  <text x="810" y="308" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="50" font-weight="600" fill="#15212E">M</text>
  <text x="810" y="392" text-anchor="middle" font-size="13" letter-spacing="2" font-weight="600" fill="#15212E">1B · CABLED SEAL (MARITIME)</text>

  <!-- 2A Lozenge Punch (cx310 my470) -->
  <path d="M310,416 L362,470 L310,524 L258,470 Z" fill="none" stroke="#15212E" stroke-width="2.5"/>
  <path d="M310,427 L350,470 L310,513 L270,470 Z" fill="none" stroke="#B68A4E" stroke-width="1"/>
  <text x="310" y="486" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="44" font-weight="600" fill="#15212E">M</text>
  <text x="310" y="572" text-anchor="middle" font-size="13" letter-spacing="2" font-weight="600" fill="#15212E">2A · LOZENGE PUNCH</text>

  <!-- 2B Escutcheon Crest (cx810 my470) -->
  <path d="M770,420 L850,420 L850,462 Q850,500 810,524 Q770,500 770,462 Z" fill="none" stroke="#15212E" stroke-width="2.5"/>
  <path d="M778,428 L842,428 L842,461 Q842,494 810,514 Q778,494 778,461 Z" fill="none" stroke="#B68A4E" stroke-width="1"/>
  <polygon points="810,408 815,416 810,424 805,416" fill="#B68A4E"/>
  <text x="810" y="481" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="40" font-weight="600" fill="#15212E">M</text>
  <text x="810" y="572" text-anchor="middle" font-size="13" letter-spacing="2" font-weight="600" fill="#15212E">2B · ESCUTCHEON CREST</text>

  <line x1="60" y1="612" x2="1060" y2="612" stroke="#D8D2C6" stroke-width="1"/>

  <!-- SECTION B -->
  <text x="60" y="650" font-size="12" letter-spacing="3" font-weight="600" fill="#B68A4E">STILL IN PLAY — REFINED</text>
  <line x1="560" y1="686" x2="560" y2="846" stroke="#E6E0D4" stroke-width="1"/>

  <!-- 4 Dagger refined (cx310 my745) -->
  <polygon points="310,690 315,697 310,704 305,697" fill="#7C2A33"/>
  <rect x="306" y="704" width="8" height="24" fill="#7C2A33"/>
  <rect x="268" y="726" width="84" height="7" fill="#7C2A33"/>
  <polygon points="304,733 316,733 310,838" fill="#7C2A33"/>
  <line x1="310" y1="738" x2="310" y2="828" stroke="#FBFAF7" stroke-width="1.2"/>
  <text x="310" y="884" text-anchor="middle" font-size="13" letter-spacing="2" font-weight="600" fill="#15212E">04 · THE DAGGER</text>

  <!-- 5 Imprint wordmark (cx810 my745) -->
  <polygon points="842,704 862,692 866,700 846,712" fill="#B68A4E"/>
  <text x="810" y="758" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="46" letter-spacing="6" fill="#15212E">MARQUE</text>
  <line x1="726" y1="772" x2="894" y2="772" stroke="#B68A4E" stroke-width="1"/>
  <text x="810" y="792" text-anchor="middle" font-size="12" letter-spacing="6" fill="#7A8089">PUBLISHING</text>
  <text x="810" y="884" text-anchor="middle" font-size="13" letter-spacing="2" font-weight="600" fill="#15212E">05 · THE IMPRINT</text>

  <line x1="60" y1="924" x2="1060" y2="924" stroke="#D8D2C6" stroke-width="1"/>

  <!-- SECTION C HYBRID -->
  <text x="60" y="962" font-size="12" letter-spacing="3" font-weight="600" fill="#B68A4E">THE HYBRID — HALLMARK FRAME · IMPRINT ACCENT · HIDDEN BLADE</text>

  <!-- hybrid mark (cx270 my1040) -->
  <path d="M270,986 L322,1040 L270,1130 L218,1040 Z" fill="none" stroke="#15212E" stroke-width="2.5"/>
  <path d="M270,997 L310,1040 L270,1083 L230,1040 Z" fill="none" stroke="#B68A4E" stroke-width="1"/>
  <polygon points="261,1082 279,1082 270,1130 Z" fill="#7C2A33"/>
  <polygon points="292,1002 312,990 316,998 296,1010" fill="#B68A4E"/>
  <text x="270" y="1052" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="40" font-weight="600" fill="#15212E">M</text>

  <!-- horizontal lockup -->
  <path d="M560,1008 L590,1040 L560,1086 L530,1040 Z" fill="none" stroke="#15212E" stroke-width="2"/>
  <polygon points="555,1064 565,1064 560,1086 Z" fill="#7C2A33"/>
  <text x="560" y="1050" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="24" font-weight="600" fill="#15212E">M</text>
  <text x="616" y="1036" font-family="Georgia,'Times New Roman',serif" font-size="30" letter-spacing="4" fill="#15212E">MARQUE</text>
  <text x="618" y="1060" font-size="11" letter-spacing="6" fill="#7A8089">PUBLISHING</text>

  <text x="60" y="1186" font-size="13" fill="#7A8089">The lozenge gives you the maker's-mark authority of 1 &amp; 2; the brass accent is the elegance you liked in 5;</text>
  <text x="60" y="1208" font-size="13" fill="#7A8089">the oxblood tip is the Dagger's edge from 4 — sheathed in the frame, so it reads professional first, sharp second.</text>

  <!-- Footer -->
  <line x1="60" y1="1320" x2="1060" y2="1320" stroke="#D8D2C6" stroke-width="1"/>
  <text x="560" y="1348" text-anchor="middle" font-size="11" letter-spacing="1" fill="#7A8089">Ink #15212E · Brass #B68A4E · Oxblood #7C2A33 — all marks hold up in solid black.</text>
</svg>
